name: agenticgen
on:
  push:
    paths: ['agenticgen/**', '.github/workflows/agenticgen.yml']
  pull_request:
    paths: ['agenticgen/**', '.github/workflows/agenticgen.yml']
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      AGENTICGEN_REPOSITORY: ${{ github.workspace }}
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './agenticgen[test]'
      - run: python -m pytest agenticgen/tests/unit
      - run: python -m build agenticgen
