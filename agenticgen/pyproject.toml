[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticgen"
version = "0.1.0"
description = "Evidence-driven adaptive conditional inference control for FLOWR"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "jsonschema>=4.21", "httpx>=0.27", "threadpoolctl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]
quality = ["rdkit>=2024.9", "posebusters==0.6.5", "plip==3.0.1", "h5py>=3.11"]

[project.scripts]
agenticgen = "agenticgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenticgen = ["resources/skills/*/SKILL.md", "resources/config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/unit"]
