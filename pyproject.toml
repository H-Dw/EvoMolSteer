[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evomolsteer"
version = "0.3.0"
description = "Deterministic lineage analysis and evidence-constrained molecular reward design"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "pyarrow>=16", "scikit-learn>=1.4", "threadpoolctl>=3.1", "jsonschema>=4.21", "httpx>=0.27"]

[project.optional-dependencies]
reward = ["torch>=2.3"]
test = ["pytest>=8"]
storage = ["h5py>=3.11"]
remote = ["paramiko>=3.5"]
plots = ["matplotlib>=3.9"]
chemistry = ["rdkit>=2024.9"]
terminal = ["rdkit>=2024.9", "posebusters==0.6.5"]

[project.scripts]
evomolsteer = "evomolsteer.cli:main"
evomolsteer-generate = "evomolsteer.generation.launcher:main"
evomolsteer-optimize = "evomolsteer.storage.cli:main"
evomolsteer-gradient = "evomolsteer.generation.gradient_controller:main"
evomolsteer-multistage = "evomolsteer.generation.multistage_controller:main"
evomolsteer-window = "evomolsteer.generation.window_controller:main"
evomolsteer-steer = "evomolsteer.generation.steer_launcher:main"
evomolsteer-steer-event = "evomolsteer.storage.selection_dataset:main"
evomolsteer-steer-targets = "evomolsteer.generation.steer_campaign:main"
evomolsteer-steer-archive = "evomolsteer.storage.target_archive:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
